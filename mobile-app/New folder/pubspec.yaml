name: warehouse
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # QR / Camera scanner
  mobile_scanner: ^5.2.3
  firebase_core: ^3.13.0
  firebase_database: ^11.3.5
  qr_flutter: ^4.1.0
  # HTTP requests pentru Azure SQL
  http: ^1.6.0
  cloud_functions: ^5.6.2
  # Secure storage pentru token-ul de sesiune
  flutter_secure_storage: ^9.2.2

  # Grafice pentru Analytics screen
  fl_chart: ^0.68.0

  # Icons frumoase
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
